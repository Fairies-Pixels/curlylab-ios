disabled_rules:
  - trailing_whitespace

opt_in_rules:
  - empty_count
  - missing_docs
  - explicit_init

excluded:
  - curl-iosTests
  - curl-iosUITests

line_length:
  warning: 200

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

function_body_length:
  warning: 50
  error: 100

identifier_name:
  min_length: 2
  max_length: 50
  excluded: [id, URL]
